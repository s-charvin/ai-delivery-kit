# 错误码表 (MVP 首批 15 个高频 E_* 错误)
# 格式: code / int 值 / message_zh / message_en

errors:
  - code: E_PROTECTED_BRANCH
    int: 10001
    message_zh: "操作被拒绝：目标分支受保护，禁止直接推送或删除"
    message_en: "Operation denied: target branch is protected, direct push or deletion is forbidden"

  - code: E_PR_TEMPLATE_MISSING_FIELD
    int: 10002
    message_zh: "PR 模板校验失败：缺少必需字段"
    message_en: "PR template validation failed: required field is missing"

  - code: E_DEPS_NOT_SATISFIED
    int: 10003
    message_zh: "依赖未满足：当前节点的前置依赖节点尚未完成"
    message_en: "Dependencies not satisfied: prerequisite nodes of current node are not done"

  - code: E_PERMISSION_DENIED
    int: 10004
    message_zh: "权限不足：当前角色无权执行此操作"
    message_en: "Permission denied: current role is not authorized for this action"

  - code: E_TOKEN_EXPIRED
    int: 10005
    message_zh: "访问令牌已过期，请重新鉴权"
    message_en: "Access token has expired, please re-authenticate"

  - code: E_TOKEN_SCOPE_MISMATCH
    int: 10006
    message_zh: "令牌权限范围不匹配：缺少必要的 scope"
    message_en: "Token scope mismatch: required scope is missing"

  - code: E_REPO_UNREACHABLE
    int: 10007
    message_zh: "仓库不可达：无法连接到代码托管服务或仓库不存在"
    message_en: "Repository unreachable: cannot connect to git host or repo not found"

  - code: E_LFS_PUSH_FAILED
    int: 10008
    message_zh: "Git LFS 推送失败：大文件上传未完成"
    message_en: "Git LFS push failed: large file upload did not complete"

  - code: E_NODE_PENDING_PR_EXISTS
    int: 10009
    message_zh: "节点已有待处理 PR：请勿重复创建"
    message_en: "Pending PR already exists for this node: do not create duplicate"

  - code: E_NOT_OPTIONAL
    int: 10010
    message_zh: "节点不是 optional 类型：无法跳过或标记为省略"
    message_en: "Node is not optional: cannot skip or mark as omitted"

  - code: E_PIPELINE_CANCELLED
    int: 10011
    message_zh: "流水线已被用户或调度器取消"
    message_en: "Pipeline was cancelled by user or scheduler"

  - code: E_ADDENDUM_DELETES_ROWS
    int: 10012
    message_zh: "合同增补违反 WORM：试图删除或修改已存在行"
    message_en: "Addendum violates WORM: attempted to delete or modify existing rows"

  - code: E_NODE_NOT_DONE
    int: 10013
    message_zh: "节点未完成：当前操作要求节点处于 done 状态"
    message_en: "Node is not done: current action requires node in done state"

  - code: E_ADDENDUM_AUTH
    int: 10014
    message_zh: "合同增补鉴权失败：签发者不具备增补权限或签名无效"
    message_en: "Addendum auth failed: signer lacks addendum permission or signature invalid"

  - code: E_INCOMPATIBLE_NOT_DOWNSTREAM
    int: 10015
    message_zh: "依赖关系冲突：目标节点并非当前节点的下游"
    message_en: "Dependency conflict: target node is not a downstream of current node"

  - code: E_HUMAN_REVIEW_REQUIRED
    int: 10016
    message_zh: "需要人工复核：该变更触发了规则，必须由指定角色确认"
    message_en: "Human review required: this change triggered a rule and must be confirmed by designated role"
