id: generic-skill
name: Generic Fallback Skill
version: 1.0.0
description: Universal fallback skill for any unmatched node type
for_node_types:
  - "*"
required_fields:
  - node_id
  - version
  - classification
optional_fields:
  - title
  - description
  - author
deps: []
format:
  spec: Any
  content_schema_url: null
modification_rules:
  allowed_change_class:
    - compatible
    - addendum
    - breaking
  enforce_addendum_only: false
output_guides:
  max_len_bytes: 10485760
  forbidden_tokens: []
review_gates:
  coverage_min: 0.0
  requires_human: false
  lint_required: false
  test_required: false
  security_scan: true
metadata:
  no_path_traversal: true
  allowed_extensions:
    - md
    - yaml
    - yml
    - json
    - txt
