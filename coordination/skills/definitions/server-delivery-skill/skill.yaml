id: server-delivery-skill
name: Server Delivery Skill
version: 1.0.0
description: Validates server delivery gate artifacts
for_node_types:
  - server_delivery
required_fields:
  - title
  - deploy_environment
  - deploy_strategy
optional_fields:
  - rollback_plan
  - monitoring_urls
deps:
  - upstream: server_impl
    presence: required
    strictness: strict
    coupling: hard
  - upstream: server_test
    presence: required
    strictness: strict
    coupling: hard
format:
  spec: DeliveryManifest
  content_schema_url: null
modification_rules:
  allowed_change_class:
    - compatible
    - addendum
    - breaking
  enforce_addendum_only: false
output_guides:
  max_len_bytes: 10485760
  forbidden_tokens: []
review_gates:
  coverage_min: 0.0
  requires_human: true
  lint_required: true
  test_required: true
  security_scan: true
metadata: {}
