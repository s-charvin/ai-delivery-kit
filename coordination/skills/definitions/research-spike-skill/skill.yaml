id: research-spike-skill
name: Research Spike Skill
version: 1.0.0
description: Validates research spike output artifacts, supports multi-root pipelines
for_node_types:
  - research_spike
required_fields:
  - title
  - research_question
  - findings_summary
optional_fields:
  - methodology
  - references
  - alternatives_considered
deps: []
format:
  spec: ResearchReport
  content_schema_url: null
modification_rules:
  allowed_change_class:
    - compatible
    - addendum
    - breaking
  enforce_addendum_only: false
output_guides:
  max_len_bytes: 20971520
  forbidden_tokens: []
review_gates:
  coverage_min: 0.0
  requires_human: false
  lint_required: true
  test_required: false
  security_scan: true
metadata:
  supports_multi_root: true
