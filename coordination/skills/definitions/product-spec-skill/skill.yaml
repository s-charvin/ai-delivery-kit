id: product-spec-skill
name: Product Specification Skill
version: 1.0.0
description: Validates product specification artifacts
for_node_types:
  - product_spec
required_fields:
  - title
  - problem
  - scope
optional_fields:
  - goals
  - non_goals
  - user_stories
deps: []
format:
  spec: OpenSpec
  content_schema_url: null
modification_rules:
  allowed_change_class:
    - compatible
    - addendum
    - breaking
  enforce_addendum_only: false
output_guides:
  max_len_bytes: 10485760
  forbidden_tokens: []
review_gates:
  coverage_min: 0.0
  requires_human: false
  lint_required: true
  test_required: false
  security_scan: true
metadata: {}
