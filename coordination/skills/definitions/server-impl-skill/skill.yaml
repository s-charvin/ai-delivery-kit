id: server-impl-skill
name: Server Implementation Skill
version: 1.0.0
description: Validates server-side implementation artifacts
for_node_types:
  - server_impl
required_fields:
  - title
  - language
  - framework
optional_fields:
  - database
  - cache
  - queues
deps:
  - upstream: api_contract
    presence: required
    strictness: strict
    coupling: hard
format:
  spec: ServerCode
  content_schema_url: null
modification_rules:
  allowed_change_class:
    - compatible
    - addendum
    - breaking
  enforce_addendum_only: false
output_guides:
  max_len_bytes: 52428800
  forbidden_tokens: []
review_gates:
  coverage_min: 0.8
  requires_human: false
  lint_required: true
  test_required: true
  security_scan: true
metadata:
  allowed_extensions:
    - py
    - ts
    - js
    - go
    - rs
    - java
    - yaml
    - json
    - md
