version: "3.9"

name: coordination-platform

networks:
  coordination-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres-data:
    driver: local
  langfuse-db-data:
    driver: local
  vault-data:
    driver: local
  coordination-tmp:
    driver: local

services:
  coordination:
    build:
      context: ../.
      dockerfile: Dockerfile
    container_name: coordination-service
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://coordination:coordination@postgres:5432/coordination
      - LANGFUSE_HOST=http://langfuse:3030
      - LANGFUSE_PUBLIC_KEY=pk-lf-dev-xxxx
      - LANGFUSE_SECRET_KEY=sk-lf-dev-xxxx
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=dev-only-root-token
      - ENV=development
    depends_on:
      postgres:
        condition: service_healthy
      langfuse:
        condition: service_healthy
      vault:
        condition: service_healthy
    volumes:
      - coordination-tmp:/app/tmp
      - ../config:/app/config:ro
    networks:
      - coordination-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: coordination-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: coordination
      POSTGRES_PASSWORD: coordination
      POSTGRES_DB: coordination
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - coordination-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coordination -d coordination"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  langfuse-db:
    image: postgres:15-alpine
    container_name: langfuse-db
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse-db-data:/var/lib/postgresql/data
    networks:
      - coordination-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  langfuse:
    image: ghcr.io/langfuse/langfuse:3
    container_name: langfuse
    ports:
      - "3030:3000"
    environment:
      - DATABASE_URL=postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      - NEXTAUTH_SECRET=dev-only-secret-change-in-prod-0123456789abcdef
      - SALT=dev-only-salt-change-in-prod-0123456789abcdef
      - NEXTAUTH_URL=http://localhost:3030
      - TELEMETRY_ENABLED=false
    depends_on:
      langfuse-db:
        condition: service_healthy
    networks:
      - coordination-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/public/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  langfuse-worker:
    image: ghcr.io/langfuse/langfuse:3
    container_name: langfuse-worker
    command: ["pnpm", "worker"]
    environment:
      - DATABASE_URL=postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      - NEXTAUTH_SECRET=dev-only-secret-change-in-prod-0123456789abcdef
      - SALT=dev-only-salt-change-in-prod-0123456789abcdef
      - QUEUE_NAME=langfuse_queue
      - TELEMETRY_ENABLED=false
    depends_on:
      langfuse-db:
        condition: service_healthy
    networks:
      - coordination-net
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f worker || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  vault:
    image: hashicorp/vault:1.15
    container_name: coordination-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-only-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    command: ["server", "-dev"]
    volumes:
      - vault-data:/vault/data
    networks:
      - coordination-net
    healthcheck:
      test: ["CMD", "vault", "status", "-format=json"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  react-dashboard:
    image: node:20-alpine
    container_name: coordination-dashboard
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - API_BASE_URL=http://coordination:8000
    command: >
      sh -c "
        echo 'const http = require(\"http\");' > server.js &&
        echo 'const server = http.createServer((req, res) => {' >> server.js &&
        echo '  res.writeHead(200, { \"Content-Type\": \"text/plain; charset=utf-8\" });' >> server.js &&
        echo '  res.end(\"Dashboard placeholder\");' >> server.js &&
        echo '});' >> server.js &&
        echo 'server.listen(3000, \"0.0.0.0\", () => console.log(\"Dashboard placeholder running on port 3000\"));' >> server.js &&
        node server.js
      "
    volumes:
      - coordination-tmp:/app/tmp
    depends_on:
      coordination:
        condition: service_healthy
    networks:
      - coordination-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped
