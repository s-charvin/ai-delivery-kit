[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coordination"
version = "0.1.0"
description = "Coordination Platform MVP - Multi-agent delivery orchestration engine"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
authors = [
    { name = "AI Delivery Kit Team" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "crewai>=0.40,<0.45",
    "mcp>=1.0.0,<1.1",
    "langfuse>=3.0.0,<4",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "cryptography>=42.0",
    "PyJWT>=2.8",
    "jsonpath-ng>=1.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "pytest-benchmark>=4.0",
    "freezegun>=1.5",
    "ruff>=0.4",
    "mypy>=1.10",
]
db = [
    "asyncpg>=0.29",
    "sqlalchemy>=2.0",
]
vault = [
    "hvac>=2.1",
]
hotreload = []
all = [
    "asyncpg>=0.29",
    "sqlalchemy>=2.0",
    "hvac>=2.1",
]

[project.scripts]
coordination-server = "coordination.monitoring.observability_server:main"

[project.urls]
Homepage = "https://github.com/ai-delivery-kit/coordination"
Documentation = "https://docs.ai-delivery-kit.dev/coordination"
Repository = "https://github.com/ai-delivery-kit/coordination.git"
Issues = "https://github.com/ai-delivery-kit/coordination/issues"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "orchestration*",
    "crew*",
    "mcp*",
    "skills*",
    "audit*",
    "monitoring*",
    "docker*",
    "tests*",
    "config*",
    "scripts*",
    "utils*",
    "repo*",
]

[tool.setuptools.package-data]
"*" = [
    "*.yaml",
    "*.yml",
    "*.sh",
    "tests/fixtures/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Tests that take a long time to run",
    "docker: Tests that require Docker daemon running",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "W",
    "UP",
    "B",
    "SIM",
    "RUF",
]
ignore = [
    "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "crewai.*",
    "mcp.*",
    "langfuse.*",
]
ignore_missing_imports = true
