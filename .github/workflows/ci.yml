name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  android-view:
    name: Android View local rendering
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Verify View rendering, MVI and GIF
        run: bash scripts/test-android-view.sh
      - name: Upload rendering evidence and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-view-evidence
          path: |
            tests/fixtures/android-view/app/build/outputs/android-view/
            tests/fixtures/android-view/app/build/reports/
            tests/fixtures/android-view/app/build/test-results/

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache: false

      - name: Install zsh on Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Run Unix release rehearsal
        if: runner.os != 'Windows'
        run: AI_DELIVERY_RUN_GORELEASER=never AI_DELIVERY_RUN_PWSH=never bash scripts/rehearse-release.sh

      - name: Validate PowerShell script syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $null = [System.Management.Automation.Language.Parser]::ParseFile("scripts/install-ai-delivery.ps1", [ref]$null, [ref]$null)
          $null = [System.Management.Automation.Language.Parser]::ParseFile("scripts/bootstrap-ai-delivery.ps1", [ref]$null, [ref]$null)
          pwsh -NoProfile -File tests/ai-delivery-cli/install-script-powershell.test.ps1
          pwsh -NoProfile -File tests/ai-delivery-cli/bootstrap-script-powershell.test.ps1

  prerelease-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache: false

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Run release rehearsal gates
        run: AI_DELIVERY_RUN_GORELEASER=never AI_DELIVERY_RUN_PWSH=never bash scripts/rehearse-release.sh

      - name: Run GoReleaser snapshot check
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean --skip=publish
